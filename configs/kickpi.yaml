profile: kickpi

trigger:
  driver: bluetooth_keyboard
  listen_key: f13
  cancel_key: escape

face:
  driver: max7219
  spi_bus: 0
  spi_device: 0
  matrix_count: 8
  brightness: 2

audio:
  input_driver: alsa
  output_driver: alsa
  input_device: null
  output_device: null
  sample_rate_hz: 16000
  block_duration_ms: 30
  silence_timeout_ms: 1200
  maximum_recording_seconds: 15
  silence_threshold: 500
  transcription_model: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
  speech_model: ${OPENAI_SPEECH_MODEL:-tts-1}
  voice: ${OPENAI_SPEECH_VOICE:-nova}

camera:
  driver: opencv
  index: 0
  maximum_dimension: 1024
  jpeg_quality: 80
  image_detail: auto

agent:
  provider: openai
  model: ${OPENAI_MODEL:-gpt-5.6}
  reasoning_effort: low
  request_timeout_seconds: 45
  maximum_output_tokens: 500
  history_limit: 20
  maximum_tool_iterations: 5

storage:
  database_path: data/desk_pet.db

security:
  require_confirmation:
    - send_email
    - modify_calendar
    - delete_file
    - run_command
