profile: kickpi

trigger:
  driver: bluetooth_keyboard
  listen_key: a
  cancel_key: c
  device_name: MINI-KEYBOARD

face:
  # Switch to max7219 after the external 5V supply and logic buffer are installed.
  driver: terminal

audio:
  input_driver: alsa
  output_driver: alsa
  input_device: UGREEN Camera
  output_device: UACDemoV1.0
  input_channels: 2
  output_channels: 2
  output_volume: 1.0
  # The USB speaker exposes 48 kHz only; resample cues and TTS automatically.
  output_sample_rate_hz: 48000
  sample_rate_hz: 16000
  block_duration_ms: 30
  silence_timeout_ms: 1200
  maximum_recording_seconds: 15
  silence_threshold: 500
  transcription_model: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
  speech_model: ${OPENAI_SPEECH_MODEL:-tts-1}
  voice: ${OPENAI_SPEECH_VOICE:-echo}
  speech_speed: 1.5
  thinking_audio_enabled: true
  thinking_volume: 0.30
  thinking_clip_seconds: 4.2

camera:
  driver: opencv
  index: 0
  maximum_dimension: 1024
  jpeg_quality: 80
  image_detail: auto

agent:
  provider: openai
  model: ${OPENAI_MODEL:-gpt-5.6-luna}
  reasoning_effort: none
  request_timeout_seconds: 45
  maximum_output_tokens: 250
  history_limit: 8
  maximum_tool_iterations: 5
  web_search_enabled: true
  web_search_context_size: low

context:
  persona_path: configs/persona.md
  user_profile_path: data/private/user-profile.md
  maximum_characters: 20000

storage:
  database_path: data/desk_pet.db

security:
  require_confirmation:
    - send_email
    - modify_calendar
    - delete_file
    - run_command
