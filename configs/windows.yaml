profile: windows

trigger:
  driver: keyboard
  listen_key: space
  cancel_key: escape

face:
  driver: terminal

audio:
  input_driver: system_default
  output_driver: system_default
  input_device: null
  output_device: null
  sample_rate_hz: 16000
  block_duration_ms: 30
  silence_timeout_ms: 1200
  maximum_recording_seconds: 15
  silence_threshold: 500
  transcription_model: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
  speech_model: ${OPENAI_SPEECH_MODEL:-tts-1}
  voice: ${OPENAI_SPEECH_VOICE:-nova}

camera:
  driver: opencv
  index: 0

agent:
  provider: openai
  model: ${OPENAI_MODEL:-gpt-5.6}
  reasoning_effort: low
  request_timeout_seconds: 45
  maximum_output_tokens: 500
  history_limit: 20
  maximum_tool_iterations: 5

storage:
  database_path: data/desk_pet.db

security:
  require_confirmation:
    - send_email
    - modify_calendar
    - delete_file
    - run_command
